.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 18px;background:var(--bg);color:var(--sage);cursor:pointer}
.btn.fill{background:var(--sage);color:var(--on)}
.btn.ghost{background:var(--surf);color:var(--ink)}
.err{min-height:1.2em;font-size:.9rem;margin:0}
.alt{text-align:center;margin-top:16px;color:var(--mut)}

.ask{display:block;width:100%;margin:44px 0 0;padding:34px 18px;border-radius:20px;border:2px dashed var(--sage);background:none;color:var(--sage);font:600 1.5rem Fraunces,Georgia,serif;cursor:pointer}
.sheet{margin-top:18px;display:none;flex-direction:column;gap:12px}.sheet.on{display:flex}

.tabs{display:flex;gap:6px;background:var(--surf);padding:5px;border-radius:14px;margin:8px 0 18px}

.tabs .on{background:var(--sage);color:var(--on)}
#sum p{margin:0 0 14px;font-size:1.05rem}

.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px}
